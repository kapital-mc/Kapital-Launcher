# Locked: comes from sandrogekeler/AllesSandro and is re-applied by every
# template update. Change it there, not here (AllesSandro docs/updating.md).
#
# The aislop gate. Policy is .aislop/base.yml (locked); this tree's size
# ratchet is .aislop/config.yml (project-owned). ruff is pinned because
# aislop's Python engines silently report 0 issues without it.
name: aislop

on:
  push:
    branches: [main]
  pull_request:

# The job reads the tree and nothing else, so the token gets only that.
permissions:
  contents: read

jobs:
  aislop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - run: pip install ruff==0.16.7

      - run: npx --yes aislop@0.16.0 ci
