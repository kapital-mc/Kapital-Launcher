#
# Why this exists at all: a GitHub issue form applies only the static `labels:`
# list in its front matter. A dropdown answer lands as text in the issue body and
# never becomes a label on its own, so the priority field the forms ask for would
# be decorative without something reading it back out. That is this job.
#
# It also covers the case the forms cannot reach. An issue opened through the API
# rather than the chooser has no form answer in its body, which in this suite means
# an agent filed it. docs/conventions.md requires an agent to apply a p* label in
# the same call; when one does not, this is what says so. GitHub has no way to
# refuse an issue, so the strongest available gate is a comment, and a comment is
# what a person or an agent actually reads.
#
# It deliberately applies no triage label on that path. Attaching a label the repo
# does not declare makes GitHub invent it in default gray with no description --
# the known gap docs/conventions.md records -- and quietly inventing vocabulary is
# the thing design/labels.json exists to prevent. The comment needs no vocabulary.
#
# `opened` only, not `edited`: a form answer can only ever arrive when the issue is
# created, so an edit can never introduce one, and re-running on edits would fight
# a maintainer who removed a label on purpose.
